name: Build Crosy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test settings migration and CLI
        run: swift test
      - name: Build universal app and verify ZIP
        run: ./build.sh
      - name: Upload distribution ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Crosy-macOS-universal
          path: dist/Crosy-macOS-universal.zip
          if-no-files-found: error
